<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>周易 · 命理占卜</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
:root{--bg:#FFFDF5;--bg2:#FFF8E1;--card:#FFFDE7;--gold:#DAA520;--gold-l:#C6930A;--gold-d:#BDB76B;--red:#C07040;--cream:#4E342E;--text:#3E2723;--muted:#8D6E63;--border:#F0E68C;--sh:rgba(160,130,60,.1);--wood:#43A047;--fire:#E64A19;--earth:#FFB300;--metal:#607D8B;--water:#5C6BC0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;background-image:radial-gradient(ellipse at 50% 0%,#FFF9C4,var(--bg) 70%)}
h1,h2,h3,h4,.serif{font-family:'Noto Serif SC','STSong',serif}
.container{max-width:920px;margin:0 auto;padding:20px 16px 60px}
.header{text-align:center;padding:36px 0 24px}
.header h1{font-size:2.2em;color:var(--gold);letter-spacing:.15em;font-weight:900}
.header .sub{color:var(--muted);font-size:.88em;margin-top:6px;letter-spacing:.25em}
/* Form */
.form-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:24px;box-shadow:0 8px 32px var(--sh)}
.form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end}
.fg{flex:1;min-width:100px}
.fg label{display:block;color:var(--gold);font-size:.82em;margin-bottom:5px;letter-spacing:.06em}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--cream);font-size:.95em;outline:none;font-family:inherit;transition:border-color .3s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--gold)}
.fg select option{background:var(--bg2);color:var(--cream)}
.fg textarea{min-height:100px;resize:vertical}
.gender-row{display:flex;gap:10px}
.gender-btn{padding:7px 18px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);color:var(--muted);cursor:pointer;transition:all .3s;font-family:inherit;font-size:.9em}
.gender-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(218,165,32,.1)}
.time-wrap{display:flex;flex-direction:column;gap:6px}
.time-wrap.disabled{opacity:.4;pointer-events:none}
.time-wrap.disabled input[type=number]{background:var(--bg)}
.unsure-check{display:flex;align-items:center;gap:6px;font-size:.82em;color:var(--muted);cursor:pointer;user-select:none}
.unsure-check input[type=checkbox]{accent-color:var(--gold);width:15px;height:15px;cursor:pointer}
.btn-row{display:flex;gap:10px;justify-content:center;margin-top:4px}
.btn{padding:11px 32px;border:none;border-radius:10px;font-size:1em;cursor:pointer;font-family:inherit;transition:all .3s;letter-spacing:.06em}
.btn-primary{background:linear-gradient(135deg,var(--gold),#B8860B);color:#FFFDF5;font-weight:700;box-shadow:0 4px 20px rgba(218,165,32,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(218,165,32,.45)}
.btn-sec{background:transparent;border:1px solid var(--gold-d);color:var(--gold);font-weight:500}
.btn-sec:hover{background:rgba(218,165,32,.08)}
/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--card);border-radius:12px;padding:4px;border:1px solid var(--border)}
.tab{flex:1;padding:10px 8px;text-align:center;border-radius:9px;cursor:pointer;color:var(--muted);font-size:.9em;transition:all .3s;font-weight:500}
.tab.active{background:rgba(218,165,32,.12);color:var(--gold);font-weight:700}
.tab:hover:not(.active){background:rgba(0,0,0,.03)}
.module{display:none;animation:fadeUp .6s ease}.module.show{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:20px}
.card h3{color:var(--gold);font-size:1.05em;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);letter-spacing:.08em}
/* BaZi Pillars */
.pillars{display:flex;justify-content:center;gap:20px;margin:16px 0}
.pillar{text-align:center;min-width:72px}
.pillar-label{font-size:.75em;color:var(--muted);margin-bottom:6px;letter-spacing:.12em}
.pillar-stem{font-size:1.8em;font-weight:700;line-height:1.3;font-family:'Noto Serif SC',serif}
.pillar-branch{font-size:1.8em;font-weight:700;line-height:1.3;font-family:'Noto Serif SC',serif}
.pillar-stem.yang{color:#B8860B}.pillar-stem.yin{color:#1565C0}
.pillar-wx{font-size:.72em;color:var(--muted);margin-top:3px}
.pillar-zod{font-size:.72em;color:var(--gold-d);margin-top:2px}
.pillar-sst{font-size:.72em;color:var(--cream);margin-top:2px;font-style:italic}
/* Five Elements Bar */
.wx-bars{margin:16px 0}
.wx-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.wx-bar-label{width:36px;font-size:.85em;text-align:right;font-weight:600}
.wx-bar-track{flex:1;height:18px;background:rgba(0,0,0,.05);border-radius:9px;overflow:hidden;position:relative}
.wx-bar-fill{height:100%;border-radius:9px;transition:width .8s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:.7em;font-weight:700;color:rgba(0,0,0,.7)}
.wx-bar-count{width:24px;font-size:.8em;color:var(--muted);text-align:left}
.wx-木 .wx-bar-fill{background:var(--wood)}.wx-火 .wx-bar-fill{background:var(--fire)}.wx-土 .wx-bar-fill{background:var(--earth)}.wx-金 .wx-bar-fill{background:var(--metal)}.wx-水 .wx-bar-fill{background:var(--water)}
/* Ten Gods */
.shishen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:12px 0}
.shishen-item{padding:10px 14px;background:rgba(0,0,0,.03);border-radius:10px;border-left:3px solid var(--gold-d)}
.shishen-item .ss-name{color:var(--gold);font-weight:600;font-size:.9em}
.shishen-item .ss-pos{color:var(--muted);font-size:.78em;margin-top:2px}
.shishen-item .ss-desc{color:var(--text);font-size:.82em;margin-top:4px;line-height:1.6}
/* Classical quote */
.classical{font-family:'Noto Serif SC',serif;color:var(--cream);padding:10px 14px;background:rgba(218,165,32,.05);border-left:3px solid var(--gold-d);border-radius:0 8px 8px 0;margin:10px 0;font-size:.95em;line-height:1.8}
.modern-text{color:var(--text);line-height:1.9;margin:8px 0;font-size:.92em}
/* Fortune */
.fortune-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}
@media(max-width:600px){.fortune-grid{grid-template-columns:1fr}}
.fortune-item{padding:16px;background:rgba(0,0,0,.03);border-radius:12px;border:1px solid var(--border)}
.fortune-item h4{color:var(--gold);font-size:.95em;margin-bottom:8px}
.fortune-score{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fortune-stars{color:var(--gold);font-size:1.1em;letter-spacing:2px}
.fortune-text{color:var(--text);font-size:.88em;line-height:1.7}
.daily-hex{text-align:center;padding:20px;background:rgba(218,165,32,.04);border-radius:12px;margin-bottom:16px}
.daily-hex .big-char{font-size:4em;color:var(--gold);line-height:1}
.daily-hex .hex-name{font-size:1.3em;color:var(--gold-l);font-weight:700;font-family:'Noto Serif SC',serif;margin-top:8px}
.daily-hex .hex-desc{color:var(--muted);font-size:.85em;margin-top:4px}
/* Career */
.career-section{margin:16px 0}
.career-section h4{color:var(--gold);font-size:.95em;margin-bottom:10px;font-family:'Noto Serif SC',serif}
.career-tags{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.career-tag{padding:6px 14px;border-radius:20px;font-size:.82em;font-weight:500}
.career-tag.primary{background:rgba(218,165,32,.15);color:var(--gold);border:1px solid var(--gold-d)}
.career-tag.secondary{background:rgba(92,107,192,.1);color:var(--water);border:1px solid rgba(92,107,192,.3)}
.personality-trait{padding:12px 16px;background:rgba(0,0,0,.03);border-radius:10px;margin-bottom:10px}
.personality-trait .trait-name{color:var(--gold);font-weight:600;font-size:.88em}
.personality-trait .trait-desc{color:var(--text);font-size:.85em;margin-top:4px;line-height:1.7}
/* Dream */
.dream-input-area{margin-bottom:16px}
.dream-result{margin-top:16px}
.dream-match{padding:14px 16px;background:rgba(0,0,0,.03);border-radius:10px;margin-bottom:10px;border-left:3px solid var(--gold)}
.dream-match .dm-key{color:var(--gold);font-weight:600;font-size:.92em}
.dream-match .dm-text{color:var(--cream);font-family:'Noto Serif SC',serif;margin-top:4px;font-size:.9em;line-height:1.7}
.dream-match .dm-source{color:var(--muted);font-size:.78em;margin-top:4px;font-style:italic}
.dream-cat-tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.dream-cat-tag{padding:4px 10px;border-radius:14px;font-size:.75em;cursor:pointer;background:rgba(0,0,0,.05);color:var(--muted);border:1px solid transparent;transition:all .3s}
.dream-cat-tag:hover,.dream-cat-tag.active{border-color:var(--gold);color:var(--gold);background:rgba(218,165,32,.08)}
/* Hex lines */
.hex-visual{display:flex;flex-direction:column-reverse;align-items:center;gap:5px;margin:12px 0}
.hex-line{display:flex;justify-content:center;gap:10px;height:7px;width:72px}
.hex-line .yang{width:72px;height:7px;background:var(--gold);border-radius:2px}
.hex-line .yin-h{width:30px;height:7px;background:var(--gold);border-radius:2px}
.hex-line.changing .yang,.hex-line.changing .yin-h{background:var(--red)}
/* Summary card */
.summary{background:linear-gradient(135deg,rgba(218,165,32,.12),rgba(192,112,64,.06));border:1px solid var(--gold-d);border-radius:14px;padding:24px;margin-bottom:20px}
.summary h3{color:var(--gold);font-size:1.1em;margin-bottom:14px;letter-spacing:.08em}
.summary p{line-height:1.9;font-size:.92em;margin-bottom:8px}
.note{color:var(--muted);font-size:.8em;margin-top:12px;font-style:italic;text-align:center}
.results-wrap{display:none}.results-wrap.show{display:block}
/* Scrollbar */
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--gold-d);border-radius:3px}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>周 易 · 命 理</h1><div class="sub">八 字 命 盘 · 运 势 · 事 业 · 解 梦</div></div>

<div class="form-card">
 <div class="form-row">

  <div class="fg"><label>出生时间</label>
   <div class="time-wrap" id="timeWrap">

     <input type="number" id="bHour" min="0" max="23" value="12" style="width:56px;text-align:center" placeholder="时">
     <span style="color:var(--muted)">:</span>
     <input type="number" id="bMinute" min="0" max="59" value="0" style="width:56px;text-align:center" placeholder="分">
    </div>
    <label class="unsure-check"><input type="checkbox" id="bUnsure" onchange="toggleTime()"> 不确定具体时间</label>

  </div>
 </div>
 <div class="form-row">
  <div class="fg"><label>性别</label>
   <div class="gender-row">
    <button class="gender-btn active" onclick="setG(0,this)">男</button>
    <button class="gender-btn" onclick="setG(1,this)">女</button>
   </div>
  </div>
 </div>
 <div class="btn-row">
  <button class="btn btn-primary" onclick="runDivine()">起 卦 占 算</button>
  <button class="btn btn-sec" onclick="useNow()">用当前时间</button>
 </div>
</div>

<div class="results-wrap" id="resultsWrap">
 <div class="tabs" id="tabBar">
  <div class="tab active" onclick="switchTab(0)">命盘总览</div>
  <div class="tab" onclick="switchTab(1)">今日运势</div>
  <div class="tab" onclick="switchTab(2)">职业规划</div>
  <div class="tab" onclick="switchTab(3)">周公解梦</div>

function tenGod(me,other){
 if(me===other) return '比肩';
 const d=((other-me)%10+10)%10;
 const sameYy=(YY_G[me]===YY_G[other]);
 const meWx=Math.floor(me/2), oWx=Math.floor(other/2);
 const wxD=((oWx-meWx)%5+5)%5;
 // 生我:1,4 我生:3,0 克我:2,3 我克:4,1... 用差值映射

const DM_ANALYSIS = {

function calcDayun(bz,bYear,bMonth,bDay,gender){
 const yearYang=YY_G[bz.year.s]===1;
 const isMale=gender===0;
 const forward=(yearYang===isMale);
 const jieApprox=[0,6,34,63,94,125,155,187,218,249,279,310,341];
 const bm=bz.month.b;
 const birthDOY=Math.floor((new Date(bYear,bMonth-1,bDay)-new Date(bYear,0,1))/864e5);
 let diffDays;
 if(forward){
  let nxt=jieApprox[bm+1];
  if(bm===11) nxt=jieApprox[1]+365;
  diffDays=nxt-birthDOY;
 }else{
  let prv=jieApprox[bm];
  if(bm===0) prv=jieApprox[11]-365;
  diffDays=birthDOY-prv;
 }
 diffDays=Math.max(3,Math.abs(diffDays));
 const startAge=Math.max(1,Math.min(9,Math.round(diffDays/3)));
 const periods=[];
 const ms=bz.month.s, mb=bz.month.b;
 for(let i=0;i<8;i++){
  const offset=forward?(i+1):(-(i+1));
  const ps=((ms+offset)%10+10)%10;
  const pb=((mb+offset)%12+12)%12;
  const age=startAge+i*10;
  periods.push({
   ageStart:age,ageEnd:age+9,
   stem:ps,branch:pb,
   stemName:TG[ps],branchName:DZ[pb],
   wxG:WX_G[ps],wxZ:WX_Z[ps]
  });
 }
 return {startAge,forward,periods};
}

function calcBaZi(y,m,d,hb){
 const ys=((y-4)%10+10)%10, yb=((y-4)%12+12)%12;
 const mb=(m+1)%12, sSt=[2,4,6,8,0], ms=(sSt[ys%5]+m-1)%10;
 const ref=new Date(Date.UTC(2000,0,7)),tgt=new Date(Date.UTC(y,m-1,d));
 const diff=Math.round((tgt-ref)/864e5), jz=((6+diff)%60+60)%60;
 const ds=jz%10, db=jz%12;
 let hour=null;
 if(hb>=0){
  const sStH=[0,2,4,6,8], hs=(sStH[ds%5]+hb)%10;
  hour={s:hs,b:hb};
 }
 return {
  year:{s:ys,b:yb}, month:{s:ms,b:mb}, day:{s:ds,b:db,jz}, hour:hour
 };
}

function fiveElementCount(bz){
 const cnt={木:0,火:0,土:0,金:0,水:0};
 [bz.year,bz.month,bz.day].forEach(p=>{
  cnt[WX_G[p.s]]++; cnt[WX_Z[p.b]]++;
 });
 if(bz.hour){cnt[WX_G[bz.hour.s]]++;cnt[WX_Z[bz.hour.b]]++;}
 return cnt;
}

function tenGods(bz){
 const me=bz.day.s;
 const result={
  yearStem:{god:tenGod(me,bz.year.s),label:'年干',char:TG[bz.year.s]},
  monthStem:{god:tenGod(me,bz.month.s),label:'月干',char:TG[bz.month.s]}
 };
 if(bz.hour) result.hourStem={god:tenGod(me,bz.hour.s),label:'时干',char:TG[bz.hour.s]};
 return result;
}

function deriveDailyHex(bz,today){
 // 以今日干支+本命信息起每日卦
 const tdPillar=calcBaZi(today.getFullYear(),today.getMonth()+1,today.getDate(),0);
 const upper=((tdPillar.day.s+1)*3+bz.day.b+1)%8||8;
 const lower=((bz.day.s+1)*2+tdPillar.day.b+1)%8||8;
 const changing=((tdPillar.day.s+tdPillar.day.b+bz.day.s+bz.day.b)%6)||6;
 return {upper,lower,changing};
}

function deriveBaZiHex(bz){
 const yn=ZN[bz.year.b],mn=ZN[bz.month.b],dn=ZN[bz.day.b];
 const us=yn+mn+dn; let ui=us%8||8;
 let li,cl;
 if(bz.hour){
  const hn=ZN[bz.hour.b];
  const ts=us+hn; li=ts%8||8; cl=ts%6||6;
 } else {
  // 不确定时辰：以日柱天干数取下卦，年月日总数取动爻
  li=(bz.day.s+1)%8||8;
  cl=us%6||6;
 }
 return {upper:ui,lower:li,changing:cl};
}

 const genAdvice=genScore>=4?'整体运势大吉，贵人运旺，宜把握机遇。出行、签约、求财皆可。':genScore>=3?'整体运势平稳，无大吉凶。宜踏实做事、积蓄力量。':'整体运势偏弱，宜静不宜动。注意健康，出行谨慎，凡事三思而后行。';

 let h=`<div class="card"><h3>今日干支 · ${y}年${m}月${d}日</h3>
  <div style="text-align:center;margin-bottom:16px">
   <span style="font-size:1.6em;color:var(--gold);font-weight:700" class="serif">${TG[tdPillar.day.s]}${DZ[tdPillar.day.b]}</span>
   <span style="color:var(--muted);font-size:.85em;margin-left:8px">${WX_G[tdPillar.day.s]}${WX_Z[tdPillar.day.b]}</span>
   <div style="color:var(--muted);font-size:.82em;margin-top:6px">今日天干「${TG[tdPillar.day.s]}」与日主「${TG[bz.day.s]}」关系：<strong style="color:var(--gold)">${rel}</strong></div>
   <div style="color:var(--text);font-size:.85em;margin-top:4px">${relInfo.desc}</div>
  </div>
  <div class="daily-hex">

   <div class="hex-visual">${renderHexLines(lines,dailyHex.changing)}</div>
   <div class="classical" style="text-align:left;margin-top:12px">${dh?dh.gc:''}</div>
  </div>
 </div>`;

 h+=`<div class="fortune-grid">
  <div class="fortune-item">
   <h4>💼 事业运势</h4>
   <div class="fortune-score"><span class="fortune-stars">${stars(careerScore)}</span></div>
   <div class="fortune-text">${careerAdvice}</div>
  </div>
  <div class="fortune-item">
   <h4>❤️ 爱情运势</h4>
   <div class="fortune-score"><span class="fortune-stars">${stars(loveScore)}</span></div>
   <div class="fortune-text">${loveAdvice}</div>
  </div>
  <div class="fortune-item" style="grid-column:1/-1">
   <h4>🔮 综合运势</h4>
   <div class="fortune-score"><span class="fortune-stars">${stars(genScore)}</span></div>
   <div class="fortune-text">${genAdvice}</div>
  </div>
 </div>`;

 h+=`<div class="note">运势分析基于本命八字与今日干支之生克关系，参考《易经》卦象与十神推演。占卜之辞仅供参考，事在人为。</div>`;

 document.getElementById('mod1').innerHTML=h;
}

 const tg=tenGods(bz);

 h+=`</div></div>`;

  <div class="career-section">

 dm.careers.forEach(c=>{h+=`<span class="career-tag primary">${c}</span>`;});
 h+=`</div></div>

  <div class="career-section">
   <h4>适合行业领域（${dmWx}属性 + ${topWx}旺气）</h4>
   <div class="career-tags">`;
 allInd.slice(0,12).forEach(c=>{h+=`<span class="career-tag secondary">${c}</span>`;});
 h+=`</div></div>

  <div class="career-section">
   <h4>应避免的方向</h4>
   <div class="modern-text">${dm.avoid}</div>
  </div>

  <div class="classical" style="margin-top:16px">「天行健，君子以自强不息；地势坤，君子以厚德载物。」—《易经》</div>
  <div class="modern-text">命理所示乃先天禀赋，后天努力同样重要。选择与自身五行相合、性格匹配的方向，方能事半功倍、人尽其才。</div>

 // 离职/求职建议专题

// ─── 模块3: 周公解梦 ───
let dreamCat='全部';
function renderModule3(){
 const cats=['全部','天象','地理','鸟兽','身体','人事','器物','鬼神'];
 let h=`<div class="card"><h3>周 公 解 梦</h3>
  <div class="modern-text" style="margin-bottom:12px">输入您的梦境描述，系统将匹配《周公解梦》中的相关解析。也可以点击下方分类浏览常见梦境的含义。</div>
  <div class="dream-input-area">
   <div class="fg"><textarea id="dreamText" placeholder="请描述你的梦境，例如：&#10;我梦见自己在山上看到一条大蛇&#10;我梦见骑着白马飞过河流"></textarea></div>
   <div class="btn-row" style="margin-top:10px">
    <button class="btn btn-primary" onclick="searchDream()">解 梦</button>
   </div>
  </div>
  <div class="dream-cat-tags" id="dreamCats">`;
 cats.forEach(c=>{
  h+=`<span class="dream-cat-tag${c==='全部'?' active':''}" onclick="filterCat('${c}',this)">${c}</span>`;
 });
 h+=`</div>
  <div id="dreamResults" class="dream-result"></div>
 </div>`;
 document.getElementById('mod3').innerHTML=h;
 renderDreamList(DREAMS);
}

function filterCat(cat,el){
 dreamCat=cat;
 document.querySelectorAll('.dream-cat-tag').forEach(x=>x.classList.remove('active'));
 el.classList.add('active');
 if(cat==='全部') renderDreamList(DREAMS);
 else renderDreamList(DREAMS.filter(d=>d.s.includes(cat)));
}

function searchDream(){
 const text=document.getElementById('dreamText').value.trim();
 if(!text){alert('请输入梦境描述');return;}
 const matches=[];
 DREAMS.forEach(entry=>{
  let score=0;
  const matched=[];
  entry.k.forEach(kw=>{
   if(text.includes(kw)){score+=kw.length;matched.push(kw);}
  });
  if(score>0) matches.push({...entry,score,matched});
 });
 matches.sort((a,b)=>b.score-a.score);
 if(matches.length===0){
  // 尝试更宽泛的匹配
  const chars=[...text];
  const loose=[];
  DREAMS.forEach(entry=>{
   let score=0;
   entry.k.forEach(kw=>{
    chars.forEach(ch=>{if(kw.includes(ch))score+=0.5;});
   });
   if(score>0)loose.push({...entry,score,matched:[]});
  });
  loose.sort((a,b)=>b.score-a.score);
  renderDreamList(loose.slice(0,8),'未找到精确匹配，以下为相关参考：');
 } else {
  renderDreamList(matches.slice(0,8),'根据你的梦境，找到以下相关解析：');
 }
}

function renderDreamList(items,prefix){
 let h=prefix?`<div class="modern-text" style="margin-bottom:10px;color:var(--gold)">${prefix}</div>`:'';
 items.forEach(d=>{
  h+=`<div class="dream-match">
   <div class="dm-key">${d.k.slice(0,4).join(' / ')}</div>
   <div class="dm-text">${d.t}</div>
   <div class="dm-source">${d.s}</div>
  </div>`;
 });
 if(items.length===0) h+=`<div class="modern-text" style="text-align:center;color:var(--muted)">暂无匹配的解梦条目</div>`;
 document.getElementById('dreamResults').innerHTML=h;
}

}
