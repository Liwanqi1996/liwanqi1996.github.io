<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>周易 · 命理占卜</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
:root{--bg:#FFFDF5;--bg2:#FFF8E1;--card:#FFFDE7;--gold:#DAA520;--gold-l:#C6930A;--gold-d:#BDB76B;--red:#C07040;--cream:#4E342E;--text:#3E2723;--muted:#8D6E63;--border:#F0E68C;--sh:rgba(160,130,60,.1);--wood:#43A047;--fire:#E64A19;--earth:#FFB300;--metal:#607D8B;--water:#5C6BC0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;background-image:radial-gradient(ellipse at 50% 0%,#FFF9C4,var(--bg) 70%)}
h1,h2,h3,h4,.serif{font-family:'Noto Serif SC','STSong',serif}
.container{max-width:920px;margin:0 auto;padding:20px 16px 60px}
.header{text-align:center;padding:36px 0 24px}
.header h1{font-size:2.2em;color:var(--gold);letter-spacing:.15em;font-weight:900}
.header .sub{color:var(--muted);font-size:.88em;margin-top:6px;letter-spacing:.25em}
/* Form */
.form-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:24px;box-shadow:0 8px 32px var(--sh)}
.form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end}
.fg{flex:1;min-width:100px}
.fg label{display:block;color:var(--gold);font-size:.82em;margin-bottom:5px;letter-spacing:.06em}
.fg input,.fg select,.fg textarea{width:100%;padding:9px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--cream);font-size:.95em;outline:none;font-family:inherit;transition:border-color .3s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--gold)}
.fg select option{background:var(--bg2);color:var(--cream)}
.fg textarea{min-height:100px;resize:vertical}
.gender-row{display:flex;gap:10px}
.gender-btn{padding:7px 18px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);color:var(--muted);cursor:pointer;transition:all .3s;font-family:inherit;font-size:.9em}
.gender-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(218,165,32,.1)}
.time-wrap{display:flex;flex-direction:column;gap:6px}
.time-wrap.disabled{opacity:.4;pointer-events:none}
.time-wrap.disabled input[type=number]{background:var(--bg)}
.unsure-check{display:flex;align-items:center;gap:6px;font-size:.82em;color:var(--muted);cursor:pointer;user-select:none}
.unsure-check input[type=checkbox]{accent-color:var(--gold);width:15px;height:15px;cursor:pointer}
.btn-row{display:flex;gap:10px;justify-content:center;margin-top:4px}
.btn{padding:11px 32px;border:none;border-radius:10px;font-size:1em;cursor:pointer;font-family:inherit;transition:all .3s;letter-spacing:.06em}
.btn-primary{background:linear-gradient(135deg,var(--gold),#B8860B);color:#FFFDF5;font-weight:700;box-shadow:0 4px 20px rgba(218,165,32,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(218,165,32,.45)}
.btn-sec{background:transparent;border:1px solid var(--gold-d);color:var(--gold);font-weight:500}
.btn-sec:hover{background:rgba(218,165,32,.08)}
/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--card);border-radius:12px;padding:4px;border:1px solid var(--border)}
.tab{flex:1;padding:10px 8px;text-align:center;border-radius:9px;cursor:pointer;color:var(--muted);font-size:.9em;transition:all .3s;font-weight:500}
.tab.active{background:rgba(218,165,32,.12);color:var(--gold);font-weight:700}
.tab:hover:not(.active){background:rgba(0,0,0,.03)}
.module{display:none;animation:fadeUp .6s ease}.module.show{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:20px}
.card h3{color:var(--gold);font-size:1.05em;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);letter-spacing:.08em}
/* BaZi Pillars */
.pillars{display:flex;justify-content:center;gap:20px;margin:16px 0}
.pillar{text-align:center;min-width:72px}
.pillar-label{font-size:.75em;color:var(--muted);margin-bottom:6px;letter-spacing:.12em}
.pillar-stem{font-size:1.8em;font-weight:700;line-height:1.3;font-family:'Noto Serif SC',serif}
.pillar-branch{font-size:1.8em;font-weight:700;line-height:1.3;font-family:'Noto Serif SC',serif}
.pillar-stem.yang{color:#B8860B}.pillar-stem.yin{color:#1565C0}
.pillar-wx{font-size:.72em;color:var(--muted);margin-top:3px}
.pillar-zod{font-size:.72em;color:var(--gold-d);margin-top:2px}
.pillar-sst{font-size:.72em;color:var(--cream);margin-top:2px;font-style:italic}
/* Five Elements Bar */
.wx-bars{margin:16px 0}
.wx-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.wx-bar-label{width:36px;font-size:.85em;text-align:right;font-weight:600}
.wx-bar-track{flex:1;height:18px;background:rgba(0,0,0,.05);border-radius:9px;overflow:hidden;position:relative}
.wx-bar-fill{height:100%;border-radius:9px;transition:width .8s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:.7em;font-weight:700;color:rgba(0,0,0,.7)}
.wx-bar-count{width:24px;font-size:.8em;color:var(--muted);text-align:left}
.wx-木 .wx-bar-fill{background:var(--wood)}.wx-火 .wx-bar-fill{background:var(--fire)}.wx-土 .wx-bar-fill{background:var(--earth)}.wx-金 .wx-bar-fill{background:var(--metal)}.wx-水 .wx-bar-fill{background:var(--water)}
/* Ten Gods */
.shishen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:12px 0}
.shishen-item{padding:10px 14px;background:rgba(0,0,0,.03);border-radius:10px;border-left:3px solid var(--gold-d)}
.shishen-item .ss-name{color:var(--gold);font-weight:600;font-size:.9em}
.shishen-item .ss-pos{color:var(--muted);font-size:.78em;margin-top:2px}
.shishen-item .ss-desc{color:var(--text);font-size:.82em;margin-top:4px;line-height:1.6}
/* Classical quote */
.classical{font-family:'Noto Serif SC',serif;color:var(--cream);padding:10px 14px;background:rgba(218,165,32,.05);border-left:3px solid var(--gold-d);border-radius:0 8px 8px 0;margin:10px 0;font-size:.95em;line-height:1.8}
.modern-text{color:var(--text);line-height:1.9;margin:8px 0;font-size:.92em}
/* Fortune */
.fortune-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}
@media(max-width:600px){.fortune-grid{grid-template-columns:1fr}}
.fortune-item{padding:16px;background:rgba(0,0,0,.03);border-radius:12px;border:1px solid var(--border)}
.fortune-item h4{color:var(--gold);font-size:.95em;margin-bottom:8px}
.fortune-score{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fortune-stars{color:var(--gold);font-size:1.1em;letter-spacing:2px}
.fortune-text{color:var(--text);font-size:.88em;line-height:1.7}
.daily-hex{text-align:center;padding:20px;background:rgba(218,165,32,.04);border-radius:12px;margin-bottom:16px}
.daily-hex .big-char{font-size:4em;color:var(--gold);line-height:1}
.daily-hex .hex-name{font-size:1.3em;color:var(--gold-l);font-weight:700;font-family:'Noto Serif SC',serif;margin-top:8px}
.daily-hex .hex-desc{color:var(--muted);font-size:.85em;margin-top:4px}
/* Career */
.career-section{margin:16px 0}
.career-section h4{color:var(--gold);font-size:.95em;margin-bottom:10px;font-family:'Noto Serif SC',serif}
.career-tags{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.career-tag{padding:6px 14px;border-radius:20px;font-size:.82em;font-weight:500}
.career-tag.primary{background:rgba(218,165,32,.15);color:var(--gold);border:1px solid var(--gold-d)}
.career-tag.secondary{background:rgba(92,107,192,.1);color:var(--water);border:1px solid rgba(92,107,192,.3)}
.personality-trait{padding:12px 16px;background:rgba(0,0,0,.03);border-radius:10px;margin-bottom:10px}
.personality-trait .trait-name{color:var(--gold);font-weight:600;font-size:.88em}
.personality-trait .trait-desc{color:var(--text);font-size:.85em;margin-top:4px;line-height:1.7}
/* Dream */
.dream-input-area{margin-bottom:16px}
.dream-result{margin-top:16px}
.dream-match{padding:14px 16px;background:rgba(0,0,0,.03);border-radius:10px;margin-bottom:10px;border-left:3px solid var(--gold)}
.dream-match .dm-key{color:var(--gold);font-weight:600;font-size:.92em}
.dream-match .dm-text{color:var(--cream);font-family:'Noto Serif SC',serif;margin-top:4px;font-size:.9em;line-height:1.7}
.dream-match .dm-source{color:var(--muted);font-size:.78em;margin-top:4px;font-style:italic}
.dream-cat-tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.dream-cat-tag{padding:4px 10px;border-radius:14px;font-size:.75em;cursor:pointer;background:rgba(0,0,0,.05);color:var(--muted);border:1px solid transparent;transition:all .3s}
.dream-cat-tag:hover,.dream-cat-tag.active{border-color:var(--gold);color:var(--gold);background:rgba(218,165,32,.08)}
/* Hex lines */
.hex-visual{display:flex;flex-direction:column-reverse;align-items:center;gap:5px;margin:12px 0}
.hex-line{display:flex;justify-content:center;gap:10px;height:7px;width:72px}
.hex-line .yang{width:72px;height:7px;background:var(--gold);border-radius:2px}
.hex-line .yin-h{width:30px;height:7px;background:var(--gold);border-radius:2px}
.hex-line.changing .yang,.hex-line.changing .yin-h{background:var(--red)}
/* Summary card */
.summary{background:linear-gradient(135deg,rgba(218,165,32,.12),rgba(192,112,64,.06));border:1px solid var(--gold-d);border-radius:14px;padding:24px;margin-bottom:20px}
.summary h3{color:var(--gold);font-size:1.1em;margin-bottom:14px;letter-spacing:.08em}
.summary p{line-height:1.9;font-size:.92em;margin-bottom:8px}
.note{color:var(--muted);font-size:.8em;margin-top:12px;font-style:italic;text-align:center}
.results-wrap{display:none}.results-wrap.show{display:block}
/* Scrollbar */
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--gold-d);border-radius:3px}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>周 易 · 命 理</h1><div class="sub">八 字 命 盘 · 运 势 · 事 业 · 解 梦</div></div>

<div class="form-card">
 <div class="form-row">
  <div class="fg"><label>出生年份</label><input type="number" id="bYear" min="1924" max="2026" value="1990"></div>
  <div class="fg"><label>月份</label><select id="bMonth"></select></div>
  <div class="fg"><label>日期</label><select id="bDay"></select></div>
  <div class="fg"><label>出生时间</label>
   <div class="time-wrap" id="timeWrap">
    <div style="display:flex;gap:6px;align-items:center">
     <input type="number" id="bHour" min="0" max="23" value="12" style="width:56px;text-align:center" placeholder="时">
     <span style="color:var(--muted)">:</span>
     <input type="number" id="bMinute" min="0" max="59" value="0" style="width:56px;text-align:center" placeholder="分">
    </div>
    <label class="unsure-check"><input type="checkbox" id="bUnsure" onchange="toggleTime()"> 不确定具体时间</label>
   </div>
  </div>
 </div>
 <div class="form-row">
  <div class="fg"><label>性别</label>
   <div class="gender-row">
    <button class="gender-btn active" onclick="setG(0,this)">男</button>
    <button class="gender-btn" onclick="setG(1,this)">女</button>
   </div>
  </div>
  <div class="fg"><label>出生地 <span style="color:var(--muted);font-size:.75em">（真太阳时校正）</span></label>
   <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
    <select id="bProvince" onchange="updateCities()" style="min-width:70px"><option value="">省份</option></select>
    <select id="bCity" onchange="updateDistricts()" style="min-width:70px"><option value="">城市</option></select>
    <select id="bDistrict" onchange="updateLon()" style="min-width:70px"><option value="">区/县</option></select>
    <input type="hidden" id="bLon" value="116">
    <span id="lonDisplay" style="color:var(--muted);font-size:.75em">116.4°E</span>
   </div>
  </div>
 </div>
 <div class="btn-row">
  <button class="btn btn-primary" onclick="runDivine()">起 卦 占 算</button>
  <button class="btn btn-sec" onclick="useNow()">用当前时间</button>
 </div>
</div>

<div class="results-wrap" id="resultsWrap">
 <div class="tabs" id="tabBar">
  <div class="tab active" onclick="switchTab(0)">命盘总览</div>
  <div class="tab" onclick="switchTab(1)">今日运势</div>
  <div class="tab" onclick="switchTab(2)">职业规划</div>
  <div class="tab" onclick="switchTab(3)">周公解梦</div>
 </div>
 <div class="module show" id="mod0"></div>
 <div class="module" id="mod1"></div>
 <div class="module" id="mod2"></div>
 <div class="module" id="mod3"></div>
</div>
</div>

<script>
/* ═══════════════════════════════════════════
   基 础 数 据

const TG=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];

// 五行颜色映射
const WX_COLORS={木:'var(--wood)',火:'var(--fire)',土:'var(--earth)',金:'var(--metal)',水:'var(--water)'};

/* ═══════════════════════════════════════════
   十 神 系 统
   ═══════════════════════════════════════════ */
function tenGod(me,other){
 if(me===other) return '比肩';
 const d=((other-me)%10+10)%10;
 const sameYy=(YY_G[me]===YY_G[other]);
 const meWx=Math.floor(me/2), oWx=Math.floor(other/2);
 const wxD=((oWx-meWx)%5+5)%5;
 // 生我:1,4 我生:3,0 克我:2,3 我克:4,1... 用差值映射
 if(wxD===0) return sameYy?'比肩':'劫财';
 if(wxD===1) return sameYy?'食神':'伤官';
 if(wxD===2) return sameYy?'偏财':'正财';
 if(wxD===3) return sameYy?'七杀':'正官';
 if(wxD===4) return sameYy?'偏印':'正印';
 return '未知';
}

 '比肩':{desc:'同类相助，主独立自主、意志坚定，善于竞争与合作并存',career:'适合独立作业、合伙创业、自由职业'},

};

/* ═══════════════════════════════════════════
   日 主 分 析 数 据
   ═══════════════════════════════════════════ */
const DM_ANALYSIS = {
 0:{name:'甲木',wx:'木',yin:false,nature:'参天大树，栋梁之材',
  personality:['正直刚毅，有领导魄力','目标远大，做事有主见','重信守诺，为人正直','性格偏固执，不善变通'],

  careers:['科研/学术','心理医生/命理师','珠宝/精密制造','IT开发/数据分析','夜间经济/照明','文秘/助理'],

// ─── 动物 ───
{k:['龙','飞龙','金龙','青龙'],t:'梦见龙，大吉大利。龙者至贵之象，帝王之征。《易》乾卦曰"飞龙在天，利见大人"，主贵人、大志得遂。',s:'《周公解梦·鸟兽》'},
{k:['凤凰','凤','彩凤'],t:'梦见凤凰，主大吉。凤为百鸟之王，主贵人、喜事、升迁。"凤鸣岐山"，太平盛世之兆。',s:'《周公解梦·鸟兽》'},
{k:['老虎','虎','猛虎','白虎'],t:'梦见老虎，主权威、力量。虎啸山林主得贵人，虎追主压力大。骑虎主驾驭困难。',s:'《周公解梦·鸟兽》'},
{k:['马','骑马','骏马','白马'],t:'梦见马，主出行、进取。天行健，君子以自强不息。骏马奔腾主事业腾飞，白马主贵人。',s:'《周公解梦·鸟兽》'},
{k:['鱼','鲤鱼','金鱼','大鱼','钓鱼'],t:'梦见鱼，主财运。鱼者余也，年年有余。鲤鱼跃龙门主升迁，钓鱼主等待中的收获。',s:'《周公解梦·鸟兽》'},
{k:['蛇','大蛇','毒蛇','小蛇'],t:'梦见蛇，主财运与智慧。蛇为小龙，有灵性。大蛇主大财，小蛇主小利。被蛇咬主得财。',s:'《周公解梦·鸟兽》'},
{k:['鸟','飞鸟','百鸟','小鸟'],t:'梦见飞鸟，主自由、理想。鸟飞高空主志向远大，鸟落枝头主安定。',s:'《周公解梦·鸟兽》'},
{k:['鹤','白鹤','仙鹤'],t:'梦见鹤，主长寿、高洁。鹤鸣九皋，声闻于天，主名声远扬、脱俗之象。',s:'《周公解梦·鸟兽》'},
{k:['牛','黄牛','水牛'],t:'梦见牛，主勤劳致富。牛性敦厚，主踏实努力终有回报。骑牛主稳步上升。',s:'《周公解梦·鸟兽》'},
{k:['狗','小狗','大狗','狗叫'],t:'梦见狗，主忠诚、友情。狗守家门，主朋友相助。狗叫主口舌是非。',s:'《周公解梦·鸟兽》'},
{k:['猫','小猫','黑猫'],t:'梦见猫，主独立、灵性。猫性慵懒而灵巧，主以柔克刚。黑猫主辟邪。',s:'《周公解梦·鸟兽》'},
{k:['蝴蝶','蝶','蝴蝶飞舞'],t:'梦见蝴蝶，主蜕变、自由。庄周梦蝶，主精神超脱、人生转变。',s:'《周公解梦·鸟兽》'},
{k:['乌龟','龟','老龟'],t:'梦见龟，主长寿、稳定。龟为四灵之一，主贵人暗助、逢凶化吉。',s:'《周公解梦·鸟兽》'},
{k:['鸡','公鸡','母鸡','鸡叫'],t:'梦见鸡，主吉。鸡鸣报晓，主好消息。公鸡主阳刚振奋，母鸡主丰收哺育。',s:'《周公解梦·鸟兽》'},
{k:['蚂蚁','蚁'],t:'梦见蚂蚁，主勤劳团结。蚁群主众志成城，小事成大业。',s:'《周公解梦·鸟兽》'},
{k:['鹿','白鹿','梅花鹿'],t:'梦见鹿，主福禄。鹿与禄同音，主官运财运。白鹿尤为祥瑞。',s:'《周公解梦·鸟兽》'},
{k:['乌鸦','黑鸟'],t:'梦见乌鸦，世俗以为凶，实则主智慧警示。鸦有反哺之义，主孝道或提醒。',s:'《周公解梦·鸟兽》'},
{k:['蜘蛛','蜘蛛网'],t:'梦见蜘蛛，主谋划布局。蜘蛛结网主精心策划终有成果，被蜘蛛咬主小人暗算。',s:'《周公解梦·鸟兽》'},
// ─── 身体 ───
{k:['头发','长发','短发','剃头','掉头发','脱发'],t:'梦见头发，主烦恼丝。长发主思虑多，短发主轻松。掉发主忧虑或破财，剃头主重新开始。',s:'《周公解梦·身体》'},
{k:['牙齿','掉牙','拔牙','牙疼'],t:'梦见牙齿，主骨肉之情。掉牙主长辈有恙或人际变化。牙白主吉，牙落主忧。',s:'《周公解梦·身体》'},
{k:['眼睛','双眼','失明','睁眼'],t:'梦见眼睛，主洞察力。明亮的眼睛主看清真相，失明主迷茫困惑。',s:'《周公解梦·身体》'},
{k:['手','双手','断手','握手'],t:'梦见手，主能力、行动。手大有力量主掌控力强，握手主合作达成。',s:'《周公解梦·身体》'},
{k:['脚','走路','赤脚','奔跑'],t:'梦见脚或行走，主前进方向。奔跑主积极追求，赤脚主脚踏实地。脚伤主前路有阻。',s:'《周公解梦·身体》'},
{k:['血','流血','吐血'],t:'梦见血，主财运。血为生命之源，流血主破财或付出，见他人血主得财。',s:'《周公解梦·身体》'},
{k:['怀孕','大肚子','肚子'],t:'梦见怀孕或大肚子，主新事物孕育中。主计划即将成形、创作将要诞生。',s:'《周公解梦·身体》'},
{k:['死亡','死了','去世','丧事'],t:'梦见死亡，非真凶，主转变重生。死亡象征旧事物终结、新阶段开始。《易》曰"生生之谓易"。',s:'《周公解梦·身体》'},
// ─── 生活 ───
{k:['结婚','婚礼','嫁娶','新娘'],t:'梦见结婚，主人际关系变化。未婚者主喜事将近，已婚者主生活新阶段。《易》咸卦主感应，归妹主婚嫁。',s:'《周公解梦·人事》'},
{k:['考试','金榜','高中','考试'],t:'梦见考试，主压力与机遇。考好主愿望达成，考差主准备不足。金榜题名主功名成就。',s:'《周公解梦·人事》'},
{k:['打架','争吵','吵架','打斗'],t:'梦见打架争吵，反主吉。主内心压力释放，梦中之争主现实中和。所谓"梦反得正"。',s:'《周公解梦·人事》'},
{k:['逃跑','追赶','被追','逃跑'],t:'梦见被追赶，主逃避现实压力。追赶者代表面对的困难，逃脱主暂时缓解，被追上主必须面对。',s:'《周公解梦·人事》'},
{k:['飞翔','飞','腾空','翱翔'],t:'梦见飞翔，大吉。主志向高远、摆脱束缚。《易》曰"飞龙在天"，主事业上升期。',s:'《周公解梦·人事》'},
{k:['掉下','坠落','跌落','从高处掉'],t:'梦见坠落，主失控感、不安。从高处跌落主地位或信心动摇，宜稳住心态。',s:'《周公解梦·人事》'},
{k:['溺水','沉水','落水','水淹'],t:'梦见溺水，主被情感或困境淹没。坎卦为水为险，宜寻求帮助，不可独自硬撑。',s:'《周公解梦·人事》'},
{k:['迷路','找不到路','走丢'],t:'梦见迷路，主方向感缺失。人生处于十字路口，宜静心思考再做抉择。',s:'《周公解梦·人事》'},
{k:['做饭','吃饭','宴席','饮酒'],t:'梦见饮食，主福气享受。宴席主社交丰收，独自吃饭主独善其身。做饭主创造力。',s:'《周公解梦·人事》'},
{k:['读书','看书','写字','书法'],t:'梦见读书写字，主求知欲旺盛。文运亨通，学业或技能将有长进。',s:'《周公解梦·人事》'},
{k:['唱歌','音乐','弹琴','乐器'],t:'梦见音乐，主内心和谐。歌者乐也，主心情愉悦或情感抒发。',s:'《周公解梦·人事》'},
{k:['搬家','迁移','搬走'],t:'梦见搬家，主环境变化。或为工作变动、生活新篇章之兆。',s:'《周公解梦·人事》'},
{k:['工作','上班','加班','同事'],t:'梦见工作场景，主事业心切。加班主压力大，与同事互动主人际关系变化。',s:'《周公解梦·人事》'},
{k:['旅行','旅游','出发','远行'],t:'梦见旅行，主心灵探索或生活变化。旅途顺畅主一切如意，旅途受阻主需谨慎。',s:'《周公解梦·人事》'},
{k:['哭泣','流泪','哭'],t:'梦见哭泣，反主吉兆。哭者宣泄也，主忧愁将散、喜事将来。所谓"梦中哭泣有喜事"。',s:'《周公解梦·人事》'},
// ─── 器物 ───
{k:['钱','金子','金银','珠宝','钻石','金币'],t:'梦见金银财宝，主财运。金为五行之一，主收敛积聚。但梦中得财，现实中须防破财。',s:'《周公解梦·器物》'},
{k:['镜子','照镜子','镜'],t:'梦见镜子，主自我认知。镜中映像清晰主了解自己，模糊主迷茫。碎镜主破镜重圆或分离。',s:'《周公解梦·器物》'},
{k:['钥匙','锁','开锁'],t:'梦见钥匙，主解决问题的方法。找到钥匙主豁然开朗，锁住主困局待解。',s:'《周公解梦·器物》'},
{k:['书','书本','古书','经书'],t:'梦见书本，主知识智慧。古书主传承，新书主新知。《易》为群经之首，梦之尤吉。',s:'《周公解梦·器物》'},
{k:['剑','刀','武器','宝剑','刀枪'],t:'梦见刀剑，主决断力。拔剑主果敢行动，宝剑主正义。《易》曰"金就砺则利"。',s:'《周公解梦·器物》'},
{k:['船','大船','小船','划船','帆船'],t:'梦见船，主渡越难关。大船主大事业，小船主小范围经营。风顺主顺遂，逆风主阻力。',s:'《周公解梦·器物》'},
{k:['车','开车','坐车','马车'],t:'梦见车辆，主前进工具。开车主掌控方向，坐车主借力前行。车坏主中途有阻。',s:'《周公解梦·器物》'},
{k:['衣服','新衣','红衣','白衣','换衣'],t:'梦见衣服，主外在形象。新衣主新开始，红衣主喜庆，白衣主清净。换衣主身份转变。',s:'《周公解梦·器物》'},
{k:['房子','房屋','新房','旧屋','房间'],t:'梦见房子，主内心世界或家庭。新房主新气象，旧屋主回忆或根基。房子倒塌主信念动摇。',s:'《周公解梦·器物》'},
{k:['门','大门','开门','关门'],t:'梦见门，主机遇入口。开门主新机会到来，关门主一段结束。《易》曰"阖户谓之坤，辟户谓之乾"。',s:'《周公解梦·器物》'},
{k:['灯笼','灯','蜡烛','火光'],t:'梦见灯光，主光明指引。黑暗中的灯光主贵人指点迷津，灯灭主暂时迷茫。',s:'《周公解梦·器物》'},
// ─── 神鬼 ───
{k:['神仙','佛祖','菩萨','观音','神仙'],t:'梦见神仙佛祖，主贵人指引。神者，示也，主上天垂象，宜听从内心善念。',s:'《周公解梦·鬼神》'},
{k:['鬼','鬼魂','幽灵','阴魂'],t:'梦见鬼，非真凶，主内心恐惧或过去的阴影。面对鬼则恐惧消散，被鬼追主逃避内心。',s:'《周公解梦·鬼神》'},
{k:['祖先','已故亲人','亡父','亡母'],t:'梦见已故亲人，主思念与传承。祖先入梦多为提醒或庇佑，宜祭奠缅怀。',s:'《周公解梦·鬼神》'},
{k:['庙','寺庙','道观','教堂'],t:'梦见庙宇寺院，主心灵安宁。入庙祈福主心愿将成，庙中跪拜主忏悔求进。',s:'《周公解梦·鬼神》'},
];

   人 生 解 读 & 大 运 系 统

function generateLifeReading(hexD,upper,lower,dm){
 const ut=TRI[upper],lt=TRI[lower];
 const ft=hexD?hexD.ft:{c:3,l:3,g:3};
 const career={
  5:'此命事业运势极佳，天生具备领袖气质与远见卓识。'+ut.n+'卦之'+ut.a+'德与'+lt.n+'卦之'+lt.a+'德相辅相成，仕途商海皆可大展宏图。早年积累经验，中年后渐入佳境，晚年功成名就。宜把握三十至四十岁之黄金发展期，大胆开拓。',
  4:'事业运颇佳，'+dm.name+'之人性情'+(dm.yin?'沉稳内敛、善于谋略':'刚毅果决、勇于开拓')+'，在'+ut.wx+'属行业（如'+wxInd(ut.wx)+'）与'+lt.wx+'属行业（如'+wxInd(lt.wx)+'）中可施展才华。虽非一蹴而就，然脚踏实地终能成就一番事业。中年后事业渐稳，宜持续深耕。',
  3:'事业运平稳中正，不偏不倚。'+ut.n+'上'+lt.n+'下之象，示命主宜守正道、稳扎稳打。不宜好高骛远，亦不可固步自封。选择与自身五行相合之行业（'+wxInd(dm.wx)+'），循序渐进可获中上之成就。',
  2:'事业之路略有曲折，需付出比常人更多之努力。'+ut.n+'之'+ut.a+'与'+lt.n+'之'+lt.a+'相合，暗示需借外力或贵人相助方可突破瓶颈。不宜频繁跳槽，宜在一个领域深耕细作，四十岁后渐见转机。',
  1:'事业运偏弱，然并非无成。命主宜选择稳定之职业，避免高风险投机之举。'+dm.name+'之人当以'+dm.ability+'为核心竞争力，低调积蓄，待时而动。大器晚成之格，切忌急功近利。'
 };
 const love={
  5:'感情运极佳，桃花旺盛且质量上乘。命主天生具有吸引异性之魅力，感情中既主动又体贴。早婚晚婚皆宜，婚后生活和谐美满。配偶多为贤良之人，夫妻相敬如宾，白头偕老之象。',
  4:'感情运颇佳，虽有小小波折终能修成正果。命主在感情中'+(dm.yin?'含蓄深情、以柔克刚':'热情主动、坦率真诚')+'，宜在社交场合多加留心。婚后需用心经营，互相理解包容，感情可历久弥新。',
  3:'感情运平稳，不会有太大起伏。命主对待感情较为理性，不轻易动心，一旦认定便全心投入。宜在二十五岁后确定终身大事，过早恐心智未熟。婚后平淡中见真情，细水长流为佳。',
  2:'感情之路略显坎坷，需多些耐心与包容。命主或性情过于内敛不善表达，或太过刚强不懂退让，需在沟通上下功夫。晚婚为宜，三十岁后心智成熟，感情方能稳定长久。',
  1:'感情运低迷，桃花虽现恐难长久。命主当先修自身，提升内在修养与外在形象，方能吸引良缘。切忌将就凑合，宁缺毋滥。待自身气场提升，姻缘自然转好。宜多行善事，广结善缘。'
 };
 const family={
  5:'家庭运极佳，出身和睦之家或能自建美满家庭。父母慈爱，兄弟姐妹互助。成家后子女孝顺贤能，家庭氛围温馨融洽。晚年儿孙绕膝，尽享天伦之乐，为有福之人。',
  4:'家庭运良好，家人关系融洽。虽偶有小摩擦，然总体和睦。命主在家庭中扮演'+(dm.yin?'温柔体贴的调和者':'坚实可靠的顶梁柱')+'角色，深得家人信赖。子女教育得法，后代有为。',
  3:'家庭运平稳中正，无大吉亦无大凶。家人关系平和，偶有分歧亦能化解。命主宜多花时间陪伴家人，增进感情。注意长辈健康，定期探望尽孝道。',
  2:'家庭关系略显紧张，或因事业繁忙疏忽家庭，或因性格差异产生矛盾。命主宜学会换位思考，多倾听家人心声。逢年过节多团聚，亲情需要用心经营维系。',
  1:'家庭运偏弱，或与原生家庭缘分较浅，或婚后家庭矛盾频发。命主宜反求诸己，先正自身言行。对家人多些宽容理解，少些计较苛责。行善积德可改善家运。'
 };
 const wealth={
  5:'财运亨通，正财偏财皆有收获。命主天生具有理财智慧，善于把握投资机会。'+ut.wx+'与'+lt.wx+'相合，利于'+wxInd(ut.wx)+'等相关行业生财。中年后财源广进，晚年富足安康，为衣食无忧之命。',
  4:'财运颇佳，正财稳定，偏财偶有惊喜。命主勤勉节俭，善于理财规划。虽非大富之命，然衣食丰足、家有余庆。宜长线投资，忌短线投机。中年后财运渐旺。',

function calcDayun(bz,bYear,bMonth,bDay,gender){
 const yearYang=YY_G[bz.year.s]===1;
 const isMale=gender===0;
 const forward=(yearYang===isMale);
 const birthJDN=dateToJDN(bYear,bMonth,bDay,12);
 const mb=bz.month.b;
 const jieLons=[315,345,15,45,75,105,135,165,195,225,255,285];
 let diffDays=15;
 if(forward){
  const ni=(mb+1)%12;
  let jieJDN=sunAtLon(bYear,jieLons[ni]);
  if(jieJDN<=birthJDN) jieJDN=sunAtLon(bYear+1,jieLons[ni]);
  diffDays=Math.round(jieJDN-birthJDN);
 }else{
  const pi=(mb+11)%12;
  let jieJDN=sunAtLon(bYear,jieLons[pi]);
  if(jieJDN>=birthJDN) jieJDN=sunAtLon(bYear-1,jieLons[pi]);
  diffDays=Math.round(birthJDN-jieJDN);
 }
 diffDays=Math.max(3,Math.abs(diffDays));
 const startAge=Math.max(1,Math.min(9,Math.round(diffDays/3)));
 const periods=[];
 const ms=bz.month.s, mbn=bz.month.b;
 for(let i=0;i<8;i++){
  const offset=forward?(i+1):(-(i+1));
  const ps=((ms+offset)%10+10)%10;
  const pb=((mbn+offset)%12+12)%12;
  const age=startAge+i*10;
  periods.push({
   ageStart:age,ageEnd:age+9,
   stem:ps,branch:pb,
   stemName:TG[ps],branchName:DZ[pb],
   wxG:WX_G[ps],wxZ:WX_Z[ps]
  });
 }
 return {startAge,forward,periods};
}

/* ═══════════════════════════════════════════
   天 文 历 法 引 擎（节气·真太阳时）
   ═══════════════════════════════════════════ */
const PI=Math.PI, RAD=PI/180;
function dateToJDN(y,m,d,h){
 const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
 return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045+(h||12)/24-0.5;
}
function sunLon(jdn){
 const T=(jdn-2451545.0)/36525;
 const L0=(280.46646+36000.76983*T+0.0003032*T*T)%360;
 const M=(357.52911+35999.05029*T-0.0001537*T*T)*RAD;
 const C=(1.914602-0.004817*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);
 const Om=125.04-1934.136*T;
 return((L0+C-0.00569-0.00478*Math.sin(Om*RAD))%360+360)%360;
}
function eot(jdn){
 const T=(jdn-2451545.0)/36525;
 const L0=(280.46646+36000.76983*T)%360;
 const M=(357.52911+35999.05029*T)*RAD;
 const e=0.016708634-0.000042037*T;
 const y=Math.tan(0.0409093/2);const y2=y*y;
 return((-y2*Math.sin(2*L0*RAD)+2*e*Math.sin(M)-4*e*y2*Math.sin(M)*Math.cos(2*L0*RAD))*180/PI*4);
}
function sunAtLon(year,targetLon){
 const jdn0=dateToJDN(year,1,1,12);
 const L0=sunLon(jdn0);
 let dL=targetLon-L0; if(dL<0) dL+=360;
 let jdn=jdn0+dL/360*365.25;
 for(let i=0;i<8;i++){
  const L=sunLon(jdn); let diff=targetLon-L;
  if(diff>180) diff-=360; if(diff<-180) diff+=360;
  jdn+=diff/360*365.25; if(Math.abs(diff)<0.001) break;
 }
 return jdn;
}
function getMonthBranchByJie(y,m,d){
 const lons=[315,345,15,45,75,105,135,165,195,225,255,285];
 const birthJDN=dateToJDN(y,m,d,12);
 let bestMb=1, bestJDN=-Infinity;
 for(let i=0;i<12;i++){
  const jdnY=sunAtLon(y,lons[i]);
  const jdnP=sunAtLon(y-1,lons[i]);
  const candidates=[{j:jdnY},{j:jdnP}];
  for(const c of candidates){
   if(c.j<=birthJDN&&c.j>bestJDN){bestJDN=c.j;bestMb=i;}
  }
 }
 return bestMb;
}
function trueSolarTime(y,m,d,hour,minute,lon){
 const jdn=dateToJDN(y,m,d,12);
 const eqTime=eot(jdn);
 const lonCorr=(lon-120)*4;
 const tst=hour*60+minute+lonCorr+eqTime;
 return Math.max(0,Math.min(1439,tst));
}

function calcBaZi(y,m,d,actualH,actualM,lon){
 lon=lon||116;
 const ys=((y-4)%10+10)%10, yb=((y-4)%12+12)%12;
 const monthIdx=getMonthBranchByJie(y,m,d);
 const mb=(monthIdx+2)%12;
 const sSt=[2,4,6,8,0], ms=(sSt[ys%5]+monthIdx)%10;
 const ref=new Date(Date.UTC(2000,0,7)),tgt=new Date(Date.UTC(y,m-1,d));
 const diff=Math.round((tgt-ref)/864e5), jz=((diff%60)+60)%60;
 const ds=jz%10, db=jz%12;
 let hour=null;
 if(actualH>=0){
  const tst=trueSolarTime(y,m,d,actualH,actualM||0,lon);
  const trueH=Math.floor(tst/60), trueM=Math.floor(tst%60);
  const trueHB=hourToBranch(trueH,trueM);
  const sStH=[0,2,4,6,8], hs=(sStH[ds%5]+trueHB)%10;
  hour={s:hs,b:trueHB};
 }
 return {
  year:{s:ys,b:yb}, month:{s:ms,b:mb}, day:{s:ds,b:db,jz}, hour:hour
 };
}

}

function hourToBranch(h,m){

 if(total>=23*60||total<1*60) return 0; // 子时 23:00-00:59
 if(total<3*60) return 1;  // 丑 01:00-02:59

}

function filterCat(cat,el){
 dreamCat=cat;
 document.querySelectorAll('.dream-cat-tag').forEach(x=>x.classList.remove('active'));
 el.classList.add('active');
 if(cat==='全部') renderDreamList(DREAMS);
 else renderDreamList(DREAMS.filter(d=>d.s.includes(cat)));
}

function searchDream(){
 const text=document.getElementById('dreamText').value.trim();
 if(!text){alert('请输入梦境描述');return;}
 const matches=[];
 DREAMS.forEach(entry=>{
  let score=0;
  const matched=[];
  entry.k.forEach(kw=>{
   if(text.includes(kw)){score+=kw.length;matched.push(kw);}
  });
  if(score>0) matches.push({...entry,score,matched});
 });
 matches.sort((a,b)=>b.score-a.score);
 if(matches.length===0){
  // 尝试更宽泛的匹配
  const chars=[...text];
  const loose=[];
  DREAMS.forEach(entry=>{
   let score=0;
   entry.k.forEach(kw=>{
    chars.forEach(ch=>{if(kw.includes(ch))score+=0.5;});
   });
   if(score>0)loose.push({...entry,score,matched:[]});
  });
  loose.sort((a,b)=>b.score-a.score);
  renderDreamList(loose.slice(0,8),'未找到精确匹配，以下为相关参考：');
 } else {
  renderDreamList(matches.slice(0,8),'根据你的梦境，找到以下相关解析：');
 }
}

function renderDreamList(items,prefix){

   <div class="dm-text">${d.t}</div>

 if(items.length===0) h+=`<div class="modern-text" style="text-align:center;color:var(--muted)">暂无匹配的解梦条目</div>`;
 document.getElementById('dreamResults').innerHTML=h;
}

function updateCities(){
 const prov=document.getElementById('bProvince').value;
 const cs=document.getElementById('bCity'),ds=document.getElementById('bDistrict');
 cs.innerHTML='<option value="">城市</option>';ds.innerHTML='<option value="">区/县</option>';
 if(CITIES[prov]){
  Object.keys(CITIES[prov]).forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;cs.appendChild(o);});
  const cities=Object.keys(CITIES[prov]);
  if(cities.length===1){cs.value=cities[0];updateDistricts();}
 }
}
function updateDistricts(){
 const prov=document.getElementById('bProvince').value;
 const city=document.getElementById('bCity').value;
 const ds=document.getElementById('bDistrict');
 ds.innerHTML='<option value="">区/县</option>';
 if(prov&&city&&CITIES[prov]&&CITIES[prov][city]){
  const dObj=CITIES[prov][city];
  if(typeof dObj==='number'){
   document.getElementById('bLon').value=dObj;
   document.getElementById('lonDisplay').textContent=dObj.toFixed(1)+'°E';
   return;
  }
  Object.keys(dObj).forEach(d=>{
   if(d==='_'){
    const o=document.createElement('option');o.value='_';o.textContent='全市';ds.insertBefore(o,ds.firstChild);
   } else {
    const o=document.createElement('option');o.value=d;o.textContent=d;ds.appendChild(o);
   }
  });
  const keys=Object.keys(dObj);
  if(keys.length===1){ds.value=keys[0];updateLon();}
  else if(keys.includes('_')&&keys.length<=3){ds.value='_';updateLon();}
 }
}
function updateLon(){
 const prov=document.getElementById('bProvince').value;
 const city=document.getElementById('bCity').value;
 const dist=document.getElementById('bDistrict').value;
 if(!prov||!city||!CITIES[prov]||!CITIES[prov][city]) return;
 const dObj=CITIES[prov][city];
 let lon;
 if(typeof dObj==='number'){lon=dObj;}
 else if(dist&&dObj[dist]!==undefined){lon=dObj[dist];}
 else if(dObj['_']!==undefined){lon=dObj['_'];}
 else{const vals=Object.values(dObj);lon=vals.reduce((a,b)=>a+b,0)/vals.length;}
 document.getElementById('bLon').value=lon;
 document.getElementById('lonDisplay').textContent=lon.toFixed(1)+'°E';
}
(function init(){
 const ms=document.getElementById('bMonth');
 for(let i=1;i<=12;i++){const o=document.createElement('option');o.value=i;o.textContent=i+'月';if(i===6)o.selected=true;ms.appendChild(o);}
 const ds=document.getElementById('bDay');
 for(let i=1;i<=31;i++){const o=document.createElement('option');o.value=i;o.textContent=i+'日';if(i===15)o.selected=true;ds.appendChild(o);}
 const ps=document.getElementById('bProvince');
 Object.keys(CITIES).forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;ps.appendChild(o);});
 ps.value='北京';updateCities();
})();
</script>
